<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HAPPY PAY - Scan & Pay</title>
  <style>
    :root{
      --bg:#f5f7fb; --card:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#2563eb; --ok:#16a34a; --danger:#ef4444; --line:#e2e8f0;
      --shadow:0 10px 25px rgba(15,23,42,.08); --r:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(90deg,#2563eb,#10b981);color:#fff;padding:16px}
    header .wrap{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    header h1{margin:0;font-size:18px;letter-spacing:.5px}
    .pill{background:rgba(255,255,255,.18);padding:6px 10px;border-radius:999px;font-size:12px}
    .btn{border:0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:800; font-size:13px; text-align:center;}
    .btn.primary{background:var(--primary);color:#fff}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.danger{background:var(--danger);color:#fff}
    .btn.dark{background:#0f172a;color:#fff}
    .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    main{max-width:1180px;margin:16px auto;padding:0 14px 30px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:980px){.grid{grid-template-columns:380px 1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
    .hd{padding:14px;border-bottom:1px solid var(--line)}
    .hd h2{margin:0;font-size:14px}
    .bd{padding:14px}
    label{display:block;margin:10px 0 6px;color:var(--muted);font-size:12px; font-weight: 600;}
    input, textarea, select {
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
      font-size:14px;outline:none;background:#fff; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {border-color:#93c5fd;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row > *{flex:1;min-width:150px}
    .muted{color:var(--muted);font-size:13px;line-height:1.35}
    .hr{height:1px;background:var(--line);margin:12px 0}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:900;font-size:13px}
    .tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
    table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    th,td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
    th{background:#f8fafc; font-weight:700; color:var(--muted)}
    tr:last-child td{border-bottom:0}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
    .tag{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:900; text-transform:uppercase}
    .tag.active{background:rgba(22,163,74,.15);color:#15803d}
    .tag.hold{background:rgba(245,158,11,.15);color:#b45309}
    .tag.terminated{background:rgba(239,68,68,.15);color:#b91c1c}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;
      padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);display:none;max-width:92vw;font-size:13px;z-index:9999}
    
    /* KPI Styles */
    .kpi{display:flex;gap:12px;flex-wrap:wrap}
    .kpi .box{flex:1;min-width:140px;border:1px solid var(--line);border-radius:14px;padding:16px 12px}
    .kpi .big{font-size:22px;font-weight:900;margin-top:6px}
    .small{font-size:12px}
    
    /* QR styles */
    #qrCode{margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;}
    #qrCode img { border: 4px solid #fff; box-shadow: var(--shadow); border-radius: 12px; max-width: 250px; }
    .qr-desc {font-size: 16px; margin-top: 16px; color: var(--text); font-weight: 700;}
    
    /* BIG Scanner & Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 10000;
      backdrop-filter: blur(6px);
    }
    .modal-content {
      background: #fff; padding: 24px; border-radius: 20px; 
      width: 96%; max-width: 600px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      display: flex; flex-direction: column;
    }
    .modal-content.mini { max-width: 400px; }
    .modal-content h3 { margin-top: 0; font-size: 20px; text-align: center; margin-bottom: 5px;}
    #reader { 
      width: 100%; border: 3px solid var(--primary); border-radius: 16px; 
      overflow: hidden; margin-bottom: 16px; background: #000;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>HAPPY PAY - Scan & Pay</h1>
    <div class="row" style="gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto">
      <span class="pill" id="sessionPill">Not logged in</span>
      <button class="btn ghost" id="btnLogout" style="display:none; padding: 6px 12px">Logout</button>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <!-- LEFT: LOGIN / REGISTER -->
    <div class="card">
      <div class="hd"><h2>Access</h2></div>
      <div class="bd">
        <div class="tabs">
          <button class="tab active" data-auth="login">LOGIN</button>
          <button class="tab" data-auth="register">REGISTER</button>
        </div>

        <!-- LOGIN -->
        <div id="paneLogin" style="margin-top:12px">
          <label>Phone</label>
          <input id="loginPhone" placeholder="e.g. 09xxxx / +66..." />
          <label>PIN</label>
          <input id="loginPin" type="password" placeholder="4-6 digits" />
          <button class="btn ok" style="margin-top:12px;width:100%" id="btnLogin">Login</button>
        </div>

        <!-- REGISTER -->
        <div id="paneRegister" style="display:none;margin-top:12px">
          <label>Name</label>
          <input id="applyName" placeholder="Your name" />
          <label>Phone</label>
          <input id="applyPhone" placeholder="e.g. 09xxxx / +66..." />
          <label>PIN</label>
          <input id="applyPin" type="password" placeholder="4-6 digits" />
          <button class="btn primary" style="margin-top:12px;width:100%" id="btnApply">Register</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: DASHBOARD -->
    <div class="card">
      <div class="hd">
        <h2 id="rightTitle" style="display:flex; justify-content:space-between; align-items:center;">
          Dashboard
          <span id="headerPhone" class="mono muted" style="font-size:12px;"></span>
        </h2>
      </div>
      <div class="bd">
        <div id="paneNone" class="muted">Please login to access your account.</div>

        <!-- USER DASH -->
        <div id="paneUserDash" style="display:none">
          <!-- Multi-Wallet KPI -->
          <div class="kpi">
            <div class="box" style="border-left: 4px solid var(--primary);">
              <div class="muted">Main Wallet</div>
              <div class="big" id="meBal">0 <span style="font-size:14px">MMK</span></div>
            </div>
            <div class="box" style="border-left: 4px solid var(--ok);">
              <div class="muted">Wallet 2</div>
              <div class="big" id="meBal2">0 <span style="font-size:14px">MMK</span></div>
            </div>
          </div>
          <button class="btn ghost" style="width:100%; margin-top:12px; margin-bottom:8px; color:var(--text); border: 2px dashed var(--line);" onclick="openInternalTransfer()">⇄ Move Money Between Wallets</button>
          
          <div class="hr"></div>
          
          <div class="tabs">
            <button class="tab active" data-ut="transfer">Transfer</button>
            <button class="tab" data-ut="receive">Receive</button>
            <button class="tab" data-ut="history">History</button>
          </div>

          <!-- TRANSFER -->
          <div id="uTab-transfer" style="margin-top:16px">
            <!-- Big Scan Button -->
            <button class="btn dark" style="margin-bottom:16px; width:100%; padding:24px; font-size:18px; font-weight:900; background:linear-gradient(90deg,#2563eb,#10b981); border:none; box-shadow: var(--shadow); border-radius:16px;" id="btnOpenScanner">📷 SCAN QR TO TRANSFER</button>
            
            <div style="margin-bottom: 12px;">
              <label>Transfer From</label>
              <select id="transferFromWallet">
                <option value="main">Main Wallet</option>
                <option value="wallet2">Wallet 2</option>
              </select>
            </div>
            
            <div class="row">
              <div>
                <label>To Phone (or scan)</label>
                <input id="toPhone" placeholder="Receiver's phone" />
              </div>
              <div class="muted small" style="margin-top: 36px; padding-left: 10px">
                Receiver: <b id="toName">-</b>
              </div>
            </div>
            
            <div class="row">
              <div>
                <label>Amount (MMK)</label>
                <input id="amount" type="number" min="1" step="1" placeholder="1000" />
              </div>
              <div>
                <label>Note</label>
                <input id="note" placeholder="Optional" />
              </div>
            </div>
            <button class="btn ok" style="margin-top:16px;width:100%; padding: 14px; font-size: 16px;" id="btnTransfer">Transfer</button>
          </div>

          <!-- RECEIVE -->
          <div id="uTab-receive" style="display:none;margin-top:16px">
            <div class="row" style="margin-bottom:12px;">
               <input id="receiveAmount" type="number" placeholder="Amount (Optional) - ငွေပမာဏ (ရွေးချယ်ရန်)" />
               <button class="btn dark" style="flex:none; padding:10px 16px;" onclick="generateMyQr()">Update QR</button>
            </div>
            <div class="muted small" style="text-align: center; margin-bottom: 8px;">Show this QR to receive money</div>
            <div id="qrCode"></div>
          </div>

          <!-- HISTORY -->
          <div id="uTab-history" style="display:none;margin-top:16px">
            <div id="myTxWrap"></div>
          </div>
        </div>

        <!-- ADMIN DASH -->
        <div id="paneAdminDash" style="display:none">
          <!-- Admin KPIs -->
          <div class="kpi" style="margin-bottom: 16px;">
            <div class="box">
              <div class="muted">Admin</div>
              <div class="big mono" id="adminPhoneDash">-</div>
            </div>
            <div class="box">
              <div class="muted">Pending Apps</div>
              <div class="big" id="adminPendingCount">0</div>
            </div>
            <div class="box">
              <div class="muted">Total Users</div>
              <div class="big" id="adminUsersCount">0</div>
            </div>
          </div>
          
          <div class="tabs" style="margin-bottom: 12px;">
            <button class="tab active" data-at="applications">Applications</button>
            <button class="tab" data-at="users">Users</button>
            <button class="tab" data-at="ledger">Ledger</button>
          </div>

          <div class="row" style="margin-bottom: 16px;">
             <button class="btn dark" onclick="refreshAdminDash()" style="flex:1">Refresh Stats</button>
             <button class="btn danger" onclick="createAdminDoc()" style="flex:1">Create Admin Doc</button>
          </div>

          <div class="hr"></div>

          <!-- Admin Tab: Applications (Pending) -->
          <div id="aTab-applications" style="margin-top:12px">
            <div id="adminAppsWrap"></div>
          </div>

          <!-- Admin Tab: Users Management -->
          <div id="aTab-users" style="display:none; margin-top:12px">
            <div class="row" style="margin-bottom:16px;">
               <input id="adminSearchPhone" placeholder="Search phone (exact)" style="max-width: 250px;" />
               <button class="btn dark" style="flex:none" onclick="searchAdminUsers()">Search</button>
               <button class="btn dark" style="flex:none" onclick="loadAllUsers()">Load All Users</button>
            </div>
            <div id="adminUsersWrap" style="overflow-x: auto;"></div>
          </div>

          <!-- Admin Tab: Ledger -->
          <div id="aTab-ledger" style="display:none; margin-top:12px">
            <div id="adminLedgerWrap" style="overflow-x: auto;"></div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</main>

<!-- INTERNAL TRANSFER MODAL -->
<div class="modal-overlay" id="internalModal">
  <div class="modal-content mini">
    <h3>⇄ Move Funds</h3>
    <label>Transfer Path</label>
    <select id="intFrom">
       <option value="main">Main Wallet ➔ Wallet 2</option>
       <option value="wallet2">Wallet 2 ➔ Main Wallet</option>
    </select>
    <br>
    <label>Amount (MMK)</label>
    <input id="intAmount" type="number" placeholder="Enter amount to move" />
    <div class="row" style="margin-top:20px">
       <button class="btn ghost" style="color:var(--text); border-color:var(--line)" onclick="document.getElementById('internalModal').style.display='none'">Cancel</button>
       <button class="btn ok" onclick="doInternalTransfer()">Confirm Move</button>
    </div>
  </div>
</div>

<!-- BIG SCANNER MODAL -->
<div class="modal-overlay" id="scannerModal">
  <div class="modal-content">
    <h3>📱 Scan HAPPY PAY QR</h3>
    <div class="muted small" style="text-align:center; margin-bottom:12px;">Center the QR code in the frame below</div>
    <div id="reader"></div>
    <button class="btn danger" style="width: 100%; padding:14px; font-size:16px;" id="btnCloseScanner">Close Scanner</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- QR and Scanner Libs -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, collection,
    serverTimestamp, runTransaction, query, where, limit, getDocs, deleteDoc, getCountFromServer
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAMvSkMNZDaLJQy5FboxP4_i-al4GAKGa4",
    authDomain: "ypay-abb1d.firebaseapp.com",
    projectId: "ypay-abb1d",
    storageBucket: "ypay-abb1d.firebasestorage.app",
    messagingSenderId: "248647560461",
    appId: "1:248647560461:web:abaa0ee98bd5280b891444",
    measurementId: "G-42LMHY3PDW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const $ = (id)=>document.getElementById(id);

  function toast(msg){
    const el = $("toast");
    el.textContent = msg; el.style.display="block";
    clearTimeout(toast._t);
    toast._t=setTimeout(()=>el.style.display="none", 2400);
  }
  function money(n){ return (Number(n)||0).toLocaleString("en-US"); }
  function normPhone(p){ return (p||"").trim().replace(/\s+/g,""); }
  function validPin(pin){ return /^\d{4,6}$/.test((pin||"").trim()); }
  function tsMillis(t){ return t ? (typeof t.toMillis === "function" ? t.toMillis() : 0) : 0; }

  // --- Session ---
  let session = { role:null, phone:null };

  function loadSession() {
    const stored = localStorage.getItem("happyPaySession");
    if (stored) {
      const parsed = JSON.parse(stored);
      if (parsed.expires > Date.now()) { session = parsed; } 
      else { localStorage.removeItem("happyPaySession"); }
    }
  }
  function setSession(role, phone=null){
    const expireTime = Date.now() + (24 * 60 * 60 * 1000);
    session = { role, phone, expires: expireTime };
    localStorage.setItem("happyPaySession", JSON.stringify(session));
    render();
  }
  function logout(){
    session = { role:null, phone:null };
    localStorage.removeItem("happyPaySession");
    render(); toast("Logged out.");
  }

  // --- Tab Switchers ---
  document.querySelectorAll("[data-auth]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("[data-auth]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.getAttribute("data-auth");
      $("paneLogin").style.display = (tab==="login") ? "block" : "none";
      $("paneRegister").style.display = (tab==="register") ? "block" : "none";
    });
  });

  document.querySelectorAll("[data-ut]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("[data-ut]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.getAttribute("data-ut");
      ["transfer","receive","history"].forEach(k=>{ $("uTab-"+k).style.display = (k===tab) ? "block" : "none"; });
      if(tab==="receive") window.generateMyQr();
      if(tab==="history") refreshMyTx().catch(()=>{});
    });
  });

  document.querySelectorAll("[data-at]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("[data-at]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.getAttribute("data-at");
      ["applications","users","ledger"].forEach(k=>{
        $("aTab-"+k).style.display = (k===tab) ? "block" : "none";
      });
      if(tab==="applications") refreshAdminDash();
      if(tab==="users") loadAllUsers();
      if(tab==="ledger") loadAdminLedger();
    });
  });

  $("btnLogout").addEventListener("click", logout);

  // --- Lookup & Auth ---
  let _toTimer = null;
  async function lookupReceiverName(phone){
    phone = normPhone(phone);
    if(!phone){ $("toName").textContent = "-"; return; }
    try{
      const snap = await getDoc(doc(db,"users",phone));
      $("toName").textContent = snap.exists() ? (snap.data().name || "(No name)") : "Not found";
    }catch(e){ $("toName").textContent = "Error"; }
  }
  $("toPhone").addEventListener("input", ()=>{
    clearTimeout(_toTimer); _toTimer = setTimeout(()=> lookupReceiverName($("toPhone").value), 350);
  });

  $("btnApply").addEventListener("click", async ()=>{
    const name = ($("applyName").value||"").trim(), phone = normPhone($("applyPhone").value), pin = ($("applyPin").value||"").trim();
    if(!name || !phone || !validPin(pin)) return toast("Check Name, Phone, and 4-6 digit PIN");
    try{
      await setDoc(doc(db, "applications", phone), { name, phone, pin, status: "pending", createdAt: serverTimestamp() }, { merge: false });
      toast("Registered (pending admin approval)"); $("loginPhone").value = phone;
    }catch(e){ toast("Failed"); }
  });

  $("btnLogin").addEventListener("click", async ()=>{
    const phone = normPhone($("loginPhone").value), pin = ($("loginPin").value||"").trim();
    if(!phone || !validPin(pin)) return toast("Check Phone and PIN");
    try{
      const snap = await getDoc(doc(db,"users",phone));
      if(!snap.exists()) return toast("Not found or not approved.");
      const u = snap.data();
      if(String(u.pin).trim() !== pin.trim()) return toast("Wrong PIN");
      if(u.status && u.status !== 'active' && u.role !== 'admin') {
         return toast("Your account is " + u.status.toUpperCase() + ". Access Denied.");
      }
      setSession(u.role || "user", phone); toast("Logged in.");
    }catch(e){ toast("Failed"); }
  });

  // --- USER Logic (Multi-wallet & Strict Status Enforcement) ---
  window.refreshUserDash = async function(){
    if(session.role!=="user") return;
    const snap = await getDoc(doc(db,"users",session.phone));
    if(!snap.exists()) return logout();
    const u = snap.data();
    
    // Strict Status Check for User
    if(u.status && u.status !== 'active' && u.role !== 'admin') {
        toast(`Your account is ${u.status.toUpperCase()}. You have been logged out.`);
        return logout();
    }
    
    $("headerPhone").textContent = u.phone || session.phone;
    $("meBal").innerHTML = `${money(u.balance||0)} <span style="font-size:14px">MMK</span>`;
    $("meBal2").innerHTML = `${money(u.balance2||0)} <span style="font-size:14px">MMK</span>`;
  }

  // INTERNAL TRANSFER Logic
  window.openInternalTransfer = function() {
     $("intAmount").value = "";
     $("internalModal").style.display = "flex";
  }
  
  window.doInternalTransfer = async function() {
     const fromW = $("intFrom").value;
     const amount = Math.floor(Number($("intAmount").value));
     if(isNaN(amount) || amount <= 0) return toast("Invalid amount");

     try {
        await runTransaction(db, async (tx) => {
           const ref = doc(db, "users", session.phone);
           const snap = await tx.get(ref);
           const d = snap.data();
           
           if(d.status && d.status !== 'active') throw new Error(`Your account is ${d.status.toUpperCase()}. Action blocked.`);

           const mainBal = Number(d.balance||0);
           const w2Bal = Number(d.balance2||0);

           if(fromW === "main" && mainBal < amount) throw new Error("Insufficient Main Wallet balance.");
           if(fromW === "wallet2" && w2Bal < amount) throw new Error("Insufficient Wallet 2 balance.");

           const newMain = fromW === "main" ? mainBal - amount : mainBal + amount;
           const newW2 = fromW === "wallet2" ? w2Bal - amount : w2Bal + amount;

           tx.update(ref, { balance: newMain, balance2: newW2 });
        });
        
        await addDoc(collection(db,"transactions"), {
           type: "internal", from: session.phone, to: session.phone, amount: amount,
           note: fromW === 'main' ? 'Main ➔ Wallet 2' : 'Wallet 2 ➔ Main',
           createdAt: serverTimestamp()
        });
        
        toast("Funds moved successfully.");
        $("internalModal").style.display = "none";
        refreshUserDash();
     } catch(e) { toast(e.message); }
  }

  // EXTERNAL TRANSFER Logic
  $("btnTransfer").addEventListener("click", async ()=>{
    if(session.role!=="user") return;
    const from = session.phone;
    const to = normPhone($("toPhone").value);
    const amount = Math.floor(Number($("amount").value));
    const note = ($("note").value||"").trim().slice(0, 50);
    const fromWallet = $("transferFromWallet").value;

    if(!to || to === from || isNaN(amount) || amount<=0) return toast("Invalid transfer details.");

    try{
      await runTransaction(db, async (tx)=>{
        const fRef = doc(db,"users",from), tRef = doc(db,"users",to);
        const [fSnap, tSnap] = await Promise.all([tx.get(fRef), tx.get(tRef)]);
        
        if(!fSnap.exists()) throw new Error("Your account not found.");
        if(fSnap.data().status && fSnap.data().status !== 'active') throw new Error(`Your account is ${fSnap.data().status.toUpperCase()}. Action blocked.`);
        
        if(!tSnap.exists()) throw new Error("Receiver account not found.");
        
        const fBalField = fromWallet === "main" ? "balance" : "balance2";
        const fBal = Number(fSnap.data()[fBalField]||0);
        const tBal = Number(tSnap.data().balance||0); 

        if(fBal < amount) throw new Error("Insufficient balance in selected wallet.");
        
        tx.update(fRef, { [fBalField]: fBal - amount });
        tx.update(tRef, { balance: tBal + amount });
      });

      await addDoc(collection(db,"transactions"), { 
          type: "p2p", from, to, amount, 
          note: note ? `From ${fromWallet}: ${note}` : `From ${fromWallet}`, 
          createdAt: serverTimestamp() 
      });
      
      toast(`Transferred ${money(amount)} MMK.`);
      $("toPhone").value = ""; $("amount").value = ""; $("note").value = ""; $("toName").textContent = "-";
      await refreshUserDash();
    }catch(e){ toast(e.message); }
  });

  async function refreshMyTx(){
    if(session.role!=="user") return;
    const me = session.phone;
    
    // Names Fetching
    const userDocs = await getDocs(collection(db, "users"));
    const nameMap = {};
    userDocs.forEach(d => nameMap[d.id] = d.data().name || 'Unknown');

    const q1 = query(collection(db,"transactions"), where("from","==",me), limit(40));
    const q2 = query(collection(db,"transactions"), where("to","==",me), limit(40));
    const [s1,s2] = await Promise.all([getDocs(q1), getDocs(q2)]);
    
    const map = new Map();
    s1.forEach(s=>map.set(s.id, { id:s.id, ...s.data() })); 
    s2.forEach(s=>map.set(s.id, { id:s.id, ...s.data() }));
    const merged = Array.from(map.values()).sort((a,b)=>tsMillis(b.createdAt)-tsMillis(a.createdAt)).slice(0, 50);

    if(merged.length===0){ $("myTxWrap").innerHTML = `<p class="muted small">No transactions yet.</p>`; return; }
    
    const rows = merged.map(t=>{
      const isInternal = (t.from === me && t.to === me);
      const isOut = !isInternal && (t.from===me);
      
      let otherPhone, otherName, typeLabel, amountFmt, colorClass;
      
      if (isInternal) {
          otherPhone = "Internal Move";
          otherName = "-";
          typeLabel = "TRANSFER";
          amountFmt = money(t.amount);
          colorClass = "text"; 
      } else {
          otherPhone = isOut ? t.to : t.from;
          if (otherPhone === 'admin' || otherPhone === 'SYSTEM') {
              otherPhone = 'System';
              otherName = 'Admin / System';
          } else {
              otherName = nameMap[otherPhone] || 'Unknown';
          }
          typeLabel = isOut ? "SENT" : "RECEIVED";
          amountFmt = (isOut ? "-" : "+") + money(t.amount);
          colorClass = isOut ? "danger" : "ok";
      }
      
      const noteHtml = t.note ? `<div class="small muted">${t.note}</div>` : "";
      return `<tr>
        <td>
          <div style="font-weight:700">${typeLabel}</div>
          <div class="mono small" style="margin-top:2px">${otherPhone}</div>
          <div class="muted small">${otherName}</div>
        </td>
        <td><div style="font-weight:900; color:var(--${colorClass})">${amountFmt}</div>${noteHtml}</td>
      </tr>`;
    }).join("");
    $("myTxWrap").innerHTML = `<table><tbody>${rows}</tbody></table>`;
  }

  // --- QR Generator (With Amount) ---
  window.generateMyQr = function() {
    if(!session.phone) return;
    $("qrCode").innerHTML = ''; 
    
    const amt = $("receiveAmount") ? $("receiveAmount").value : "";
    const qrText = amt ? `${session.phone}|${amt}` : session.phone;

    new QRCode($("qrCode"), {
      text: qrText,
      width: 220,
      height: 220,
      colorDark : "#0f172a",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      const desc = document.createElement("div");
      desc.className = "qr-desc mono"; 
      desc.style.textAlign = "center";
      desc.innerHTML = amt ? `${session.phone}<br><span style="color:var(--ok); font-size:18px;">${money(amt)} MMK</span>` : session.phone;
      $("qrCode").appendChild(desc);
    }, 150);
  }

  // --- QR Scanner (Big UI & Parse Amount) ---
  let html5QrcodeScanner = null;
  function onScanSuccess(decodedText) {
    stopScanner();
    const parts = decodedText.split("|");
    const phone = normPhone(parts[0]);
    $("toPhone").value = phone;

    if(parts.length > 1 && parts[1]) {
       $("amount").value = parseInt(parts[1]);
    } else {
       $("amount").value = "";
    }

    toast("Scanned Successfully.");
    lookupReceiverName(phone); 
  }

  function openScanner() {
    $("scannerModal").style.display = 'flex';
    let boxSize = Math.min(window.innerWidth * 0.75, 400); 
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: boxSize, height: boxSize} }, false);
    html5QrcodeScanner.render(onScanSuccess);
  }

  function stopScanner() {
    if (html5QrcodeScanner) { html5QrcodeScanner.clear().catch(()=>{}); html5QrcodeScanner = null; }
    $("scannerModal").style.display = 'none';
  }
  $("btnOpenScanner").addEventListener("click", openScanner);
  $("btnCloseScanner").addEventListener("click", stopScanner);


  // ================= ADMIN LOGIC =================
  window.refreshAdminDash = async function() {
    if (session.role !== "admin") return;
    $("headerPhone").textContent = "Admin | " + session.phone;
    $("adminPhoneDash").textContent = session.phone;
    try {
      const [pendSnap, userSnap] = await Promise.all([
        getCountFromServer(query(collection(db, "applications"), where("status", "==", "pending"))),
        getCountFromServer(query(collection(db, "users"), where("role", "==", "user")))
      ]);
      $("adminPendingCount").textContent = pendSnap.data().count;
      $("adminUsersCount").textContent = userSnap.data().count;

      const appDocs = await getDocs(query(collection(db, "applications"), where("status", "==", "pending")));
      if (appDocs.empty) {
        $("adminAppsWrap").innerHTML = "<p class='muted small'>No pending applications.</p>";
        return;
      }
      let html = `<table><tr><th>Phone</th><th>Name</th><th>Action</th></tr>`;
      appDocs.forEach(docSnap => {
        const d = docSnap.data();
        html += `<tr>
          <td class="mono">${d.phone}</td><td>${d.name}</td>
          <td>
            <button class="btn ok" style="padding:4px 8px; margin:2px" onclick="approveApp('${d.phone}')">Approve</button>
            <button class="btn danger" style="padding:4px 8px; margin:2px" onclick="rejectApp('${d.phone}')">Reject</button>
          </td>
        </tr>`;
      });
      $("adminAppsWrap").innerHTML = html + `</table>`;
    } catch(e) { $("adminAppsWrap").innerHTML = "<p class='danger'>Error loading data.</p>"; }
  }

  window.createAdminDoc = async function() {
      const p = prompt("Enter new Admin Phone:"); if(!p) return;
      const n = prompt("Enter Name:"); if(!n) return;
      const pin = prompt("Enter 4-6 digit PIN:"); if(!pin) return;
      try {
          await setDoc(doc(db, "users", p), { phone: p, name: n, pin: pin, role: "admin", balance: 0, balance2: 0, status: "active" });
          toast("Admin Document Created!");
      } catch(e) { toast("Failed to create admin"); }
  };

  window.approveApp = async function(phone) {
    if(!confirm("Approve " + phone + "?")) return;
    try {
      const appRef = doc(db, "applications", phone);
      const snap = await getDoc(appRef);
      if(snap.exists()) {
        await setDoc(doc(db, "users", phone), { 
            phone: snap.data().phone, name: snap.data().name, pin: snap.data().pin, 
            role: "user", balance: 0, balance2: 0, status: 'active' 
        });
        await updateDoc(appRef, { status: "approved" });
        toast("Approved"); refreshAdminDash();
      }
    } catch(e) { toast("Error"); }
  }

  window.rejectApp = async function(phone) {
    if(confirm("Reject " + phone + "?")) {
      await updateDoc(doc(db, "applications", phone), { status: "rejected" });
      refreshAdminDash();
    }
  }

  // --- Users Management ---
  window.loadAllUsers = async function() {
    if (session.role !== "admin") return;
    try {
      const qSnap = await getDocs(query(collection(db, "users"), limit(100)));
      renderUsersTable(qSnap);
    } catch (e) { $("adminUsersWrap").innerHTML = "<p class='danger'>Error loading users.</p>"; }
  };

  window.searchAdminUsers = async function() {
    const phone = normPhone($("adminSearchPhone").value);
    if(!phone) return loadAllUsers();
    try {
      const docSnap = await getDoc(doc(db, "users", phone));
      if(docSnap.exists()) renderUsersTable([docSnap]); 
      else $("adminUsersWrap").innerHTML = "<p class='muted small'>User not found.</p>";
    } catch(e) { $("adminUsersWrap").innerHTML = "<p class='danger'>Search error.</p>"; }
  };

  function renderUsersTable(docsSnap) {
     let html = `<table><tr><th>User</th><th>Status / Role</th><th>Balances</th><th style="min-width: 240px;">Action</th></tr>`;
     let count = 0;
     docsSnap.forEach(dSnap => {
        const d = dSnap.data ? dSnap.data() : dSnap;
        const phone = d.phone || dSnap.id;
        const stat = d.status || 'active';
        html += `<tr>
          <td>
            <div class="mono" style="font-weight:700">${phone}</div>
            <div class="muted small">${d.name || '-'}</div>
          </td>
          <td>
             <span class="tag ${stat}">${stat}</span><br>
             <span class="small muted" style="text-transform:uppercase">${d.role}</span>
          </td>
          <td>
            <div style="font-weight:bold; color:var(--primary)">M: ${money(d.balance)}</div>
            <div style="font-size:12px; font-weight:bold; color:var(--ok)">W2: ${money(d.balance2||0)}</div>
          </td>
          <td>
            <button class="btn dark" style="padding:4px 6px; margin:2px; font-size:11px" onclick="updateUserStatus('${phone}', 'active')">Activate</button>
            <button class="btn dark" style="padding:4px 6px; margin:2px; font-size:11px" onclick="updateUserStatus('${phone}', 'hold')">Hold</button>
            <button class="btn danger" style="padding:4px 6px; margin:2px; font-size:11px" onclick="updateUserStatus('${phone}', 'terminated')">Terminate</button>
            <button class="btn danger" style="padding:4px 6px; margin:2px; font-size:11px" onclick="adminDelete('${phone}')">Delete</button>
            <br>
            <button class="btn ok" style="padding:4px 6px; margin:2px; font-size:11px" onclick="adminTopup('${phone}')">+ Topup (Main)</button>
            <button class="btn ghost" style="padding:4px 6px; margin:2px; font-size:11px; color:var(--text); border-color:var(--text);" onclick="adminDeduct('${phone}')">- Deduct (Main)</button>
          </td>
        </tr>`;
        count++;
     });
     $("adminUsersWrap").innerHTML = count ? html + `</table>` : "<p class='muted small'>No users found.</p>";
  }

  // --- Admin Ledger & Trx Logs (With Names) ---
  window.updateUserStatus = async function(phone, status) {
      if(confirm(`Set status to ${status.toUpperCase()} for ${phone}?`)) {
          await updateDoc(doc(db, "users", phone), { status: status });
          await addDoc(collection(db, "transactions"), { type: "admin", from: session.phone, to: phone, amount: 0, note: `STATUS:${status}`, createdAt: serverTimestamp() });
          toast("Status Updated"); loadAllUsers();
      }
  }
  
  window.adminDelete = async function(phone) {
     if(confirm("CRITICAL: Permanently DELETE user " + phone + "?")) {
        await deleteDoc(doc(db, "users", phone));
        await addDoc(collection(db, "transactions"), { type: "admin", from: session.phone, to: phone, amount: 0, note: `USER DELETED`, createdAt: serverTimestamp() });
        toast("Deleted"); loadAllUsers();
     }
  };

  window.adminTopup = async function(phone) {
     const amountStr = prompt("Enter Topup Amount (MMK) for Main Wallet of " + phone + ":"); if(!amountStr) return;
     const amount = Math.floor(Number(amountStr));
     if(isNaN(amount) || amount <= 0) return toast("Invalid amount");
     try {
        await runTransaction(db, async (tx) => {
           const ref = doc(db, "users", phone); const snap = await tx.get(ref);
           if(!snap.exists()) throw new Error("User not found");
           tx.update(ref, { balance: Number(snap.data().balance || 0) + amount });
        });
        await addDoc(collection(db, "transactions"), { type: "sys", to: phone, from: "SYSTEM", amount: amount, note: "Topup to Main", createdAt: serverTimestamp() });
        toast("Topped up " + money(amount) + " MMK."); loadAllUsers(); 
     } catch(e) { toast(e.message); }
  };

  window.adminDeduct = async function(phone) {
     const amountStr = prompt("Enter amount (MMK) to DEDUCT from Main Wallet of " + phone + ":"); if(!amountStr) return;
     const amount = Math.floor(Number(amountStr));
     if(isNaN(amount) || amount <= 0) return toast("Invalid amount");
     try {
        await runTransaction(db, async (tx) => {
           const ref = doc(db, "users", phone); const snap = await tx.get(ref);
           if(!snap.exists()) throw new Error("User not found");
           const curBal = Number(snap.data().balance || 0);
           if(curBal < amount) throw new Error("User only has " + curBal + " MMK in Main.");
           tx.update(ref, { balance: curBal - amount });
        });
        await addDoc(collection(db, "transactions"), { type: "admin_deduct", from: phone, to: "admin", amount: amount, note: "Deducted by Admin", createdAt: serverTimestamp() });
        toast("Deducted " + money(amount) + " MMK."); loadAllUsers();
     } catch(e) { toast(e.message); }
  };

  window.loadAdminLedger = async function() {
    if (session.role !== "admin") return;
    try {
      const userDocs = await getDocs(collection(db, "users"));
      const nameMap = {};
      userDocs.forEach(d => nameMap[d.id] = d.data().name || 'Unknown');

      const qSnap = await getDocs(query(collection(db, "transactions"), limit(200)));
      const txs = [];
      qSnap.forEach(doc => txs.push({ id: doc.id, ...doc.data() }));
      txs.sort((a,b) => tsMillis(b.createdAt) - tsMillis(a.createdAt)); 

      if (txs.length === 0) {
        $("adminLedgerWrap").innerHTML = "<p class='muted small'>No transactions found.</p>"; return;
      }

      let html = `<table><tr><th>Type</th><th>From</th><th>To</th><th>Amount</th><th>Note</th></tr>`;
      txs.forEach(t => {
         const fromName = (t.from === 'SYSTEM' || t.from === 'admin') ? 'Admin/System' : (nameMap[t.from] || '-');
         const toName = (t.to === 'SYSTEM' || t.to === 'admin') ? 'Admin/System' : (nameMap[t.to] || '-');
         
         html += `<tr>
           <td><span class="tag active">${t.type || '-'}</span></td>
           <td>
              <div class="mono">${t.from || '-'}</div>
              <div class="small muted">${fromName}</div>
           </td>
           <td>
              <div class="mono">${t.to || '-'}</div>
              <div class="small muted">${toName}</div>
           </td>
           <td style="font-weight:bold">${money(t.amount)}</td>
           <td class="small muted">${t.note || ''}</td>
         </tr>`;
      });
      $("adminLedgerWrap").innerHTML = html + `</table>`;
    } catch(e) { $("adminLedgerWrap").innerHTML = "<p class='danger'>Error loading ledger.</p>"; }
  }


  // --- Render ---
  function render(){
    $("btnLogout").style.display = session.role ? "inline-block" : "none";
    if(session.role === "user") {
        $("sessionPill").textContent = "Active";
        $("rightTitle").innerHTML = `My Wallet <span id="headerPhone" class="mono muted" style="font-size:12px;"></span>`;
    } else if (session.role === "admin") {
        $("sessionPill").textContent = "Admin";
        $("rightTitle").innerHTML = `Admin Dashboard <span id="headerPhone" class="mono muted" style="font-size:12px;"></span>`;
    } else {
        $("sessionPill").textContent = "Not logged in";
        $("rightTitle").innerHTML = `Dashboard`;
    }

    $("paneNone").style.display = session.role ? "none" : "block";
    $("paneUserDash").style.display = session.role === "user" ? "block" : "none";
    $("paneAdminDash").style.display = session.role === "admin" ? "block" : "none";

    if(session.role === "user"){
      refreshUserDash().catch(()=>{});
      const tBtn = document.querySelector('[data-ut="transfer"]'); if(tBtn) tBtn.click();
    } else if (session.role === "admin") {
      const aBtn = document.querySelector('[data-at="applications"]'); if(aBtn) aBtn.click();
    } else {
      stopScanner(); $("qrCode").innerHTML = '';
    }
  }

  loadSession(); render();
</script>
