<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>YPAY</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--muted:#64748b;--shadow:0 10px 25px rgba(0,0,0,.06)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg)}
    header{background:linear-gradient(90deg,#2563eb,#10b981);color:#fff;padding:14px 16px}
    header .wrap{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    header h1{margin:0;font-size:18px;letter-spacing:.4px}
    .pill{background:rgba(255,255,255,.2);padding:6px 10px;border-radius:999px;font-size:12px}
    main{max-width:980px;margin:18px auto;padding:0 14px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:900px){.grid{grid-template-columns:360px 1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .hd{padding:14px;border-bottom:1px solid var(--line);font-weight:900}
    .bd{padding:14px}
    label{display:block;margin:10px 0 6px;color:var(--muted);font-size:12px}
    input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none}
    input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row>*{flex:1;min-width:140px}
    .btn{border:0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:900}
    .ok{background:#16a34a;color:#fff}
    .dark{background:#0f172a;color:#fff}
    .danger{background:#ef4444;color:#fff}
    .muted{color:var(--muted);font-size:13px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f172a;color:#fff;
      padding:10px 12px;border-radius:12px;display:none;max-width:92vw;z-index:9999}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>YPAY</h1>
    <span class="pill" id="sessionPill">Not logged in</span>
  </div>
</header>

<main>
  <div class="grid">
    <div class="card">
      <div class="hd">Login</div>
      <div class="bd">
        <label>Phone</label>
        <input id="loginPhone" placeholder="e.g. 0633 / +66..." />
        <label>PIN</label>
        <input id="loginPin" type="password" placeholder="4-6 digits" />
        <button class="btn ok" style="width:100%;margin-top:12px" id="btnLogin">Login</button>
        <button class="btn danger" style="width:100%;margin-top:10px;display:none" id="btnLogout">Logout</button>
        <div class="muted" style="margin-top:10px">
          Admins: +66633243410 / 158062, 0633 / 1111
        </div>
      </div>
    </div>

    <div class="card">
      <div class="hd" id="rightTitle">Dashboard</div>
      <div class="bd">
        <div id="paneNone" class="muted">Please login.</div>

        <div id="paneAdmin" style="display:none">
          <div class="muted">Admin logged in.</div>
        </div>

        <div id="paneUser" style="display:none">
          <div class="row">
            <div>
              <div class="muted">Your Phone</div>
              <div id="mePhone" style="font-weight:900;margin-top:4px"></div>
            </div>
            <div>
              <div class="muted">Balance</div>
              <div id="meBal" style="font-weight:900;margin-top:4px"></div>
            </div>
          </div>

          <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"/>

          <label>To Phone</label>
          <input id="toPhone" placeholder="Receiver phone" />
          <label>Amount</label>
          <input id="amount" type="number" min="1" step="1" placeholder="1000" />
          <label>Note (optional)</label>
          <input id="note" placeholder="Optional" />
          <button class="btn ok" style="width:100%;margin-top:12px" id="btnTransfer">Transfer</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- hidden slip -->
<div id="slipWrap" style="position:fixed;left:-9999px;top:-9999px;width:360px">
  <div id="slipCard" style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;padding:14px">
    <div style="font-weight:900;font-size:16px">YPAY</div>
    <div style="margin-top:6px">Status: <b>SUCCESS</b></div>
    <div style="margin-top:6px">From: <span id="slipFrom"></span></div>
    <div style="margin-top:6px">To: <span id="slipTo"></span></div>
    <div style="margin-top:6px">Amount: <span id="slipAmount"></span></div>
    <div style="margin-top:6px">Note: <span id="slipNote"></span></div>
    <div style="margin-top:6px">TX: <span id="slipTx"></span></div>
    <div style="margin-top:6px">Time: <span id="slipTime"></span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- html2canvas (try unpkg to reduce tracking blocks) -->
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, doc, getDoc, runTransaction, addDoc, collection, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // ✅ Use FULL config (your original)
  const firebaseConfig = {
    apiKey: "AIzaSyAMvSkMNZDaLJQy5FboxP4_i-al4GAKGa4",
    authDomain: "ypay-abb1d.firebaseapp.com",
    projectId: "ypay-abb1d",
    storageBucket: "ypay-abb1d.firebasestorage.app",
    messagingSenderId: "248647560461",
    appId: "1:248647560461:web:abaa0ee98bd5280b891444",
    measurementId: "G-42LMHY3PDW"
  };

  const ADMINS = [
    { phone: "+66633243410", pin: "158062" },
    { phone: "0633", pin: "1111" }
  ];

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = (id)=>document.getElementById(id);
  let session = { role:null, phone:null };

  function toast(msg){
    const el = $("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> el.style.display="none", 2600);
  }
  function money(n){ return (Number(n)||0).toLocaleString("en-US"); }

  function setSession(role, phone){
    session = { role, phone };
    $("sessionPill").textContent = role ? `${role.toUpperCase()} ${phone}` : "Not logged in";
    $("btnLogout").style.display = role ? "block" : "none";

    $("paneNone").style.display = role ? "none" : "block";
    $("paneAdmin").style.display = (role==="admin") ? "block" : "none";
    $("paneUser").style.display  = (role==="user") ? "block" : "none";
    $("rightTitle").textContent  = role ? (role==="admin" ? "Admin" : "Wallet") : "Dashboard";
  }

  async function saveSlipPNG({from,to,amount,note,txId}){
    $("slipFrom").textContent = from;
    $("slipTo").textContent = to;
    $("slipAmount").textContent = money(amount) + " MMK";
    $("slipNote").textContent = note || "-";
    $("slipTx").textContent = txId;
    $("slipTime").textContent = new Date().toLocaleString();

    const canvas = await html2canvas($("slipCard"), { scale: 2, backgroundColor:"#ffffff" });
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = `YPAY_SLIP_${String(txId).slice(0,12)}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function refreshUser(){
    const snap = await getDoc(doc(db,"users",session.phone));
    if(!snap.exists()){
      setSession(null,null);
      throw new Error("User doc not found in Firestore: users/" + session.phone);
    }
    const u = snap.data();
    $("mePhone").textContent = session.phone;
    $("meBal").textContent = money(u.balance || 0);
  }

  $("btnLogin").addEventListener("click", async ()=>{
    const phone = ($("loginPhone").value||"").trim();
    const pin = ($("loginPin").value||"").trim();
    if(!phone || !pin) return toast("Enter phone & PIN");

    try{
      // Admin
      const am = ADMINS.find(a => a.phone === phone && a.pin === pin);
      if(am){
        setSession("admin", phone);
        toast("Admin login success");
        return;
      }

      // User
      const snap = await getDoc(doc(db,"users",phone));
      if(!snap.exists()) return toast("User not found (users/"+phone+")");
      const u = snap.data();
      if(String(u.pin) !== String(pin)) return toast("Wrong PIN");

      setSession("user", phone);
      await refreshUser();
      toast("Login success");
    }catch(e){
      console.error(e);
      toast("ERROR: " + (e?.message || e));
    }
  });

  $("btnLogout").addEventListener("click", ()=>{
    setSession(null,null);
    toast("Logged out");
  });

  $("btnTransfer").addEventListener("click", async ()=>{
    if(session.role!=="user") return toast("User only");
    const from = session.phone;
    const to = ($("toPhone").value||"").trim();
    const amount = Math.floor(Number($("amount").value));
    const note = ($("note").value||"").trim().slice(0,80);

    if(!to) return toast("Enter receiver phone");
    if(!Number.isFinite(amount) || amount<=0) return toast("Enter amount");

    try{
      const fromRef = doc(db,"users",from);
      const toRef = doc(db,"users",to);

      await runTransaction(db, async (tx)=>{
        const fs = await tx.get(fromRef);
        const ts = await tx.get(toRef);
        if(!fs.exists()) throw new Error("Sender missing");
        if(!ts.exists()) throw new Error("Receiver not found: users/"+to);

        const fb = Number(fs.data().balance || 0);
        const tb = Number(ts.data().balance || 0);
        if(fb < amount) throw new Error("Insufficient balance");

        tx.update(fromRef, { balance: fb - amount });
        tx.update(toRef,   { balance: tb + amount });
      });

      const txRef = await addDoc(collection(db,"transactions"), {
        type: "p2p",
        from, to, amount, note,
        createdAt: serverTimestamp()
      });

      await refreshUser();
      toast("Transfer success + slip saved");
      await saveSlipPNG({from,to,amount,note,txId:txRef.id});

      $("toPhone").value = "";
      $("amount").value = "";
      $("note").value = "";
    }catch(e){
      console.error(e);
      toast("ERROR: " + (e?.message || e));
    }
  });

  setSession(null,null);
</script>
</body>
</html>
